name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Current Alpha Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint v0.7.1
        run: ruff check demo_v07_1.py src_v07_1 tests_v07_1 experiments_v07_1

      - name: Test v0.7.1
        run: python -m pytest -c pytest_v07_1.ini tests_v07_1 -q

      - name: Test original package
        run: python -m pytest -q tests/

  historical_integrity:
    name: Historical Integrity - Known Issues
    runs-on: ubuntu-latest

    # Historical verification is reported but non-blocking
    # until the original frozen provenance is recovered.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test historical v0.6
        id: v06
        continue-on-error: true
        run: python -m pytest -c pytest_v06.ini tests_v06 -q

      - name: Test historical v0.7
        id: v07
        continue-on-error: true
        run: python -m pytest -c pytest_v07.ini tests_v07 -q

      - name: Report historical validation results
        if: always()
        run: |
          echo "## Historical integrity validation" >> "$GITHUB_STEP_SUMMARY"
          echo "v0.6: ${{ steps.v06.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "v0.7: ${{ steps.v07.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Known unresolved v0.5.2 frozen-source provenance discrepancy." >> "$GITHUB_STEP_SUMMARY"
          echo "Historical seals and expected hashes must not be rewritten." >> "$GITHUB_STEP_SUMMARY"

      - name: Flag historical integrity failures
        if: steps.v06.outcome == 'failure' || steps.v07.outcome == 'failure'
        run: exit 1
