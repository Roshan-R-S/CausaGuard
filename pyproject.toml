[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "causaguard"
version = "0.1.0"
description = "Local-first counterfactual intervention policy research lab for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "scikit-learn>=1.4,<2",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pydantic>=2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
causaguard = "causaguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/causaguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
